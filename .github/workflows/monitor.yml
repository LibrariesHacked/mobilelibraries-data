name: Validate mobile library datasets

on:
  push:
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'services.csv'
      - 'datapackage.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
  schedule:
    # Runs at 00:00 on day 1 of every 6th month (January and July)
    - cron: '0 0 1 */6 *'
  workflow_dispatch:

jobs:
  validate-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate datapackage and datasets
        run: |
          python scripts/validate.py

      - name: Verify routes and routing engine
        run: |
          python scripts/routing.py --all

      - name: Build and verify unified UK dataset and summary
        run: |
          python scripts/combine.py

      - name: Check for uncommitted generated data changes
        run: |
          git diff --exit-code data/

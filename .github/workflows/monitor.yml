# Validates every dataset in data/ against schemas/mobile-library-stops.json.
# Runs on pushes to main that touch data/schema/scripts, twice a year
# (1 January and 1 July), and on demand via "Run workflow".
# Live timetable monitoring (content-hash change detection) is not wired up yet.
name: Validate mobile library datasets

on:
  schedule:
    # Runs at 00:00 on day 1 of every 6th month (January and July)
    - cron: '0 0 1 */6 *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'services.csv'

jobs:
  validate-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate all authority datasets against Table Schema
        run: |
          python -c "
          from frictionless import Resource, Schema
          from pathlib import Path
          import sys

          schema = Schema('schemas/mobile-library-stops.json')
          schema.foreign_keys = []
          errors = 0

          for f in sorted(Path('data').glob('*.csv')):
              if f.name.startswith('uk_'): continue
              res = Resource(str(f), schema=schema)
              rep = res.validate()
              if not rep.valid:
                  errors += 1
                  print(f'❌ {f.name} validation failed:')
                  for err in rep.flatten(['rowNumber', 'fieldName', 'message'])[:5]:
                      print('  ', err)
              else:
                  print(f'✓ {f.name} valid ({len(res.read_rows())} stops)')

          if errors > 0:
              print(f'Validation failed for {errors} dataset(s).')
              sys.exit(1)
          print('All authority datasets passed schema validation!')
          "

      - name: Build and validate unified UK dataset
        run: |
          python scripts/combine.py
